name: Deploy AnhChat Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install

      - name: Find or create D1
        id: d1
        shell: bash
        run: |
          set -e

          DB_ID="$(npx wrangler d1 list --json | node -e '
          let s="";
          process.stdin.on("data",d=>s+=d);
          process.stdin.on("end",()=>{
            const a=JSON.parse(s);
            const db=a.find(x=>x.name==="anhchat-db");
            if(db) process.stdout.write(db.uuid || db.id || "");
          });
          ')"

          if [ -z "$DB_ID" ]; then
            echo "Membuat D1 anhchat-db..."

            npx wrangler d1 create anhchat-db

            DB_ID="$(npx wrangler d1 list --json | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const a=JSON.parse(s);
              const db=a.find(x=>x.name==="anhchat-db");
              if(db) process.stdout.write(db.uuid || db.id || "");
            });
            ')"
          fi

          if [ -z "$DB_ID" ]; then
            echo "D1 database ID tidak ditemukan"
            exit 1
          fi

          echo "D1 ID ditemukan."
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Create Wrangler config
        shell: bash
        run: |
          cat > wrangler.toml <<EOF2
          name = "anhchat-api"
          main = "src/index.js"
          compatibility_date = "2026-08-27"

          [[d1_databases]]
          binding = "DB"
          database_name = "anhchat-db"
          database_id = "${{ steps.d1.outputs.db_id }}"
          EOF2

          cat wrangler.toml

      - name: Apply database schema
        run: |
          npx wrangler d1 execute anhchat-db \
            --remote \
            --file=./schema.sql \
            --yes

      - name: Deploy Worker
        run: |
          npx wrangler deploy

      - name: Show deployment
        run: |
          npx wrangler deployments list
